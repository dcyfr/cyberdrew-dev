# Pixel-truth contrast gate.
#
# The site is built almost entirely out of backdrop-filter glass, so the
# effective background behind any glyph is the blurred page rather than the
# panel's declared fill. A token-based checker cannot see that, and reports
# comfortable passes for text that is genuinely hard to read. This builds the
# site, serves it, and measures actual composited pixels.
#
# See scripts/a11y-contrast.mjs for the method and for why "transient" boxes
# (text mid-dissolve under the floating dock) are reported but not failed on.
name: a11y contrast

on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "scripts/a11y-contrast.mjs"
      - ".github/workflows/a11y-contrast.yml"
  workflow_dispatch:

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Deliberately --no-save, and NOT a devDependency in package.json.
      # Regenerating this lockfile on a different platform prunes the
      # optional @emnapi/* entries and breaks `npm ci` on Vercel, so the
      # lockfile is left strictly alone and the audit's own dependency is
      # installed out of band. Version pinned so the rendering engine that
      # produces the numbers is the same one that produced the thresholds.
      - run: npm i --no-save playwright@1.61.1
      - run: npx playwright install --with-deps chromium

      - run: npm run build

      - name: Serve and audit
        run: |
          npx next start -p 3000 &
          curl --retry 30 --retry-delay 2 --retry-all-errors \
               --fail --silent --output /dev/null http://localhost:3000/
          AUDIT_URL=http://localhost:3000/ AUDIT_JSON=contrast-report.json \
            npm run audit:contrast

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrast-report
          path: contrast-report.json
          if-no-files-found: ignore
